# Railway service config for the Kestrel FastAPI (Soft Ink web backend).
# Create a new Railway service → Settings → Config as Code → railway.api.toml
# (Keep root railway.toml for the existing eBay webhook service.)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"

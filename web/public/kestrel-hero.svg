<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16120f"/>
      <stop offset="42%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <radialGradient id="copperBloom" cx="78%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#b87333" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#b87333" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b87333" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftInk" cx="8%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#1a1510" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineCopper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0"/>
      <stop offset="18%" stop-color="#d4a574" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#b87333" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b87333" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2218" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#171310" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0f0d0b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b87333" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grain" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="18" r="0.7" fill="#fff" opacity="0.045"/>
      <circle cx="42" cy="66" r="0.6" fill="#fff" opacity="0.035"/>
      <circle cx="96" cy="28" r="0.8" fill="#fff" opacity="0.04"/>
      <circle cx="118" cy="92" r="0.55" fill="#fff" opacity="0.03"/>
      <circle cx="64" cy="112" r="0.7" fill="#fff" opacity="0.04"/>
      <circle cx="22" cy="98" r="0.5" fill="#d4a574" opacity="0.035"/>
      <circle cx="130" cy="48" r="0.6" fill="#d4a574" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#copperBloom)"/>
  <rect width="1920" height="1080" fill="url(#leftInk)"/>

  <!-- Soft grid -->
  <g opacity="0.085" stroke="#d4a574" stroke-width="1">
    <path d="M720 0 V1080 M840 0 V1080 M960 0 V1080 M1080 0 V1080 M1200 0 V1080 M1320 0 V1080 M1440 0 V1080 M1560 0 V1080 M1680 0 V1080 M1800 0 V1080"/>
    <path d="M0 180 H1920 M0 300 H1920 M0 420 H1920 M0 540 H1920 M0 660 H1920 M0 780 H1920 M0 900 H1920"/>
  </g>

  <!-- Price path -->
  <g filter="url(#softGlow)">
    <path
      d="M620 690 C760 670, 820 740, 940 620 S1120 470, 1240 520 S1420 610, 1560 430 S1720 300, 1860 340"
      fill="none"
      stroke="url(#lineCopper)"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <path
      d="M620 690 C760 670, 820 740, 940 620 S1120 470, 1240 520 S1420 610, 1560 430 S1720 300, 1860 340 L1860 900 L620 900 Z"
      fill="#b87333"
      opacity="0.07"
    />
  </g>

  <!-- Candle marks -->
  <g opacity="0.42" stroke-linecap="round">
    <g stroke="#d4a574" stroke-width="2">
      <line x1="1020" y1="560" x2="1020" y2="610"/><rect x="1012" y="575" width="16" height="28" fill="#b87333" opacity="0.55" stroke="none"/>
      <line x1="1088" y1="500" x2="1088" y2="575"/><rect x="1080" y="520" width="16" height="40" fill="#8a5a2b" opacity="0.7" stroke="none"/>
      <line x1="1156" y1="470" x2="1156" y2="540"/><rect x="1148" y="485" width="16" height="36" fill="#d4a574" opacity="0.45" stroke="none"/>
      <line x1="1224" y1="505" x2="1224" y2="565"/><rect x="1216" y="525" width="16" height="28" fill="#b87333" opacity="0.5" stroke="none"/>
      <line x1="1360" y1="455" x2="1360" y2="520"/><rect x="1352" y="470" width="16" height="34" fill="#d4a574" opacity="0.4" stroke="none"/>
      <line x1="1490" y1="390" x2="1490" y2="470"/><rect x="1482" y="410" width="16" height="42" fill="#b87333" opacity="0.55" stroke="none"/>
    </g>
  </g>

  <!-- Oversized card silhouettes (right plane) -->
  <g opacity="0.9">
    <g transform="translate(1280 140) rotate(12)">
      <rect x="0" y="0" width="420" height="590" rx="28" fill="url(#cardFace)" stroke="url(#cardEdge)" stroke-width="2"/>
      <rect x="34" y="42" width="352" height="220" rx="18" fill="#b87333" opacity="0.12"/>
      <rect x="34" y="290" width="220" height="16" rx="8" fill="#d4a574" opacity="0.28"/>
      <rect x="34" y="326" width="160" height="12" rx="6" fill="#d4a574" opacity="0.16"/>
      <rect x="34" y="430" width="352" height="110" rx="16" fill="#000" opacity="0.28"/>
      <path d="M70 490 C140 450, 220 520, 350 470" fill="none" stroke="#d4a574" stroke-width="2.5" opacity="0.55"/>
    </g>
    <g transform="translate(1540 250) rotate(-8)" opacity="0.72">
      <rect x="0" y="0" width="360" height="510" rx="24" fill="url(#cardFace)" stroke="#d4a574" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="28" y="36" width="304" height="180" rx="14" fill="#b87333" opacity="0.1"/>
      <rect x="28" y="250" width="180" height="12" rx="6" fill="#d4a574" opacity="0.2"/>
    </g>
  </g>

  <rect width="1920" height="1080" fill="url(#grain)"/>
  <!-- Left reading scrim -->
  <rect width="1920" height="1080" fill="url(#leftInk)"/>
</svg>

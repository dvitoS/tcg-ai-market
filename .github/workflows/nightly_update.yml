# Nightly katalog + PokéWallet povijest + XGBoost retrain (UTC).
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_KEY, TCG_API_KEY
name: Nightly TCG Database & AI Update

on:
  schedule:
    # 03:00 UTC svake noći
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system libs for XGBoost
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-import critical packages
        run: |
          python - <<'PY'
          import xgboost
          import sklearn
          import supabase
          import pandas
          print("imports ok", xgboost.__version__)
          PY

      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_KEY in repo Actions secrets."
            exit 1
          fi
          echo "Supabase secrets are present."
          if [ -z "${{ secrets.TCG_API_KEY }}" ]; then
            echo "::warning::TCG_API_KEY is empty — nightly will use synthetic history fallback."
          fi

      - name: Run nightly_update.py
        env:
          PYTHONUNBUFFERED: "1"
          # Ručni test: stavi NIGHTLY_CARD_LIMIT=50 u workflow_dispatch inputs kasnije ako treba.
          # Prazno = sync svih karata (noćni job).
          NIGHTLY_CARD_LIMIT: ${{ github.event_name == 'workflow_dispatch' && '100' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: python nightly_update.py

# Nightly katalog + PokéWallet povijest + XGBoost retrain (UTC).
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_KEY, TCG_API_KEY
name: Nightly TCG Database & AI Update

on:
  schedule:
    # 03:00 UTC svake noći
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly-update:
    runs-on: ubuntu-latest
    # Puni sync kataloga + rate limit može trajati satima
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run nightly_update.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: python nightly_update.py

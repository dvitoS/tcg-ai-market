# Nightly katalog + JustTCG (NM) / PokéWallet povijest + XGBoost retrain (UTC).
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_KEY, JUSTTCG_API_KEY (prefer), TCG_API_KEY (fallback)
name: Nightly TCG Database & AI Update

on:
  schedule:
    # 03:00 UTC svake noći
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: "Refresh curated catalog (default ~9 liquid sets · $5+; override via CATALOG_SET_IDS)"
        type: boolean
        default: true
      card_limit:
        description: "Live price sync limit (all, or e.g. 50). Limited runs prioritize cards missing history."
        type: string
        default: "all"

jobs:
  nightly-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system libs for XGBoost
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-import critical packages
        run: |
          python - <<'PY'
          import xgboost
          import sklearn
          import supabase
          import pandas
          print("imports ok", xgboost.__version__)
          PY

      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_KEY in repo Actions secrets."
            echo "Repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Supabase secrets are present."
          if [ -z "${{ secrets.JUSTTCG_API_KEY }}" ] && [ -z "${{ secrets.TCG_API_KEY }}" ]; then
            echo "::warning::JUSTTCG_API_KEY and TCG_API_KEY empty — synthetic history fallback."
          elif [ -n "${{ secrets.JUSTTCG_API_KEY }}" ]; then
            echo "JUSTTCG_API_KEY is present (preferred NM sync)."
          else
            echo "TCG_API_KEY is present (PokéWallet fallback)."
          fi

      - name: Diagnose Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          from config import get_supabase_credentials

          url, key = get_supabase_credentials()
          print("normalized_url:", url)
          print("key_len:", len(key), "key_prefix:", key[:6] if key else "")
          endpoint = f"{url}/rest/v1/cards?select=id&limit=1"
          req = Request(
              endpoint,
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Accept": "application/json",
              },
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  body = resp.read()[:300]
                  print("HTTP", resp.status, body)
          except HTTPError as exc:
              detail = exc.read()[:500]
              print("HTTPError", exc.code, detail)
              raise SystemExit(f"Supabase REST failed: HTTP {exc.code}") from exc
          except URLError as exc:
              raise SystemExit(f"Supabase network failed: {exc}") from exc
          print("Supabase REST OK")
          PY

      - name: Run nightly_update.py
        env:
          PYTHONUNBUFFERED: "1"
          # Schedule: always refresh catalog. Manual: honor refresh_catalog checkbox (default on).
          NIGHTLY_SKIP_CATALOG: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_catalog == false && '1' || '0' }}
          # Manual default "all" so Streamlit sees every $5+ card (synthetic history fills gaps).
          NIGHTLY_CARD_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.card_limit || 'all' }}
          # Resolve missing cards.tcgplayer_id via TCGplayer public search (drip).
          NIGHTLY_BACKFILL_TCP: "1"
          NIGHTLY_BACKFILL_TCP_LIMIT: "60"
          # Keep JustTCG search off by default (429 risk); TCP search is primary.
          NIGHTLY_BACKFILL_JUSTTCG: "0"
          # Optional: CATALOG_SET_IDS="sv3pt5:151,swsh7:Evolving Skies,..."
          CATALOG_SET_IDS: ${{ secrets.CATALOG_SET_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
          # Optional watchlist email digests
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_THRESHOLD_PCT: ${{ secrets.ALERT_THRESHOLD_PCT }}
          ALERT_SURE_ONLY: ${{ secrets.ALERT_SURE_ONLY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python nightly_update.py

      - name: Upload automation.log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-automation-log
          path: automation.log
          if-no-files-found: ignore

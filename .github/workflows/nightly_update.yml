# Nightly katalog + PokéWallet povijest + XGBoost retrain (UTC).
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_KEY, TCG_API_KEY
name: Nightly TCG Database & AI Update

on:
  schedule:
    # 03:00 UTC svake noći
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system libs for XGBoost
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-import critical packages
        run: |
          python - <<'PY'
          import xgboost
          import sklearn
          import supabase
          import pandas
          print("imports ok", xgboost.__version__)
          PY

      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_KEY in repo Actions secrets."
            echo "Repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Supabase secrets are present."
          if [ -z "${{ secrets.TCG_API_KEY }}" ]; then
            echo "::warning::TCG_API_KEY is empty — nightly will use synthetic history fallback."
          fi

      - name: Diagnose Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          from config import get_supabase_credentials

          url, key = get_supabase_credentials()
          print("normalized_url:", url)
          print("key_len:", len(key), "key_prefix:", key[:6] if key else "")
          endpoint = f"{url}/rest/v1/cards?select=id&limit=1"
          req = Request(
              endpoint,
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Accept": "application/json",
              },
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  body = resp.read()[:300]
                  print("HTTP", resp.status, body)
          except HTTPError as exc:
              detail = exc.read()[:500]
              print("HTTPError", exc.code, detail)
              raise SystemExit(f"Supabase REST failed: HTTP {exc.code}") from exc
          except URLError as exc:
              raise SystemExit(f"Supabase network failed: {exc}") from exc
          print("Supabase REST OK")
          PY

      - name: Run nightly_update.py
        env:
          PYTHONUNBUFFERED: "1"
          NIGHTLY_CARD_LIMIT: "100"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: python nightly_update.py

# Nightly katalog (gap-fill) + JustTCG NM history drip + XGBoost retrain (UTC).
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_KEY, JUSTTCG_API_KEY (prefer), TCG_API_KEY (fallback)
#   POKEMONTCG_API_KEY — optional legacy key only (API deprecated; no new registrations)
name: Nightly TCG Database & AI Update

on:
  schedule:
    # 03:00 UTC svake noći
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      catalog_mode:
        description: "Catalog mode: gapfill (missing sets only), full (all sets), skip"
        type: choice
        options:
          - gapfill
          - full
          - skip
        default: gapfill
      card_limit:
        description: "JustTCG sync card limit (all, or e.g. 400). Missing history first."
        type: string
        default: "400"
      catalog_set_budget:
        description: "Max sets to fetch in gapfill mode (ignored for full)"
        type: string
        default: "50"

jobs:
  nightly-update:
    runs-on: ubuntu-24.04
    # Gap-fill + JustTCG drip should finish well under 2h; keep headroom for retries.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system libs for XGBoost
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-import critical packages
        run: |
          python - <<'PY'
          import xgboost
          import sklearn
          import supabase
          import pandas
          print("imports ok", xgboost.__version__)
          PY

      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_KEY in repo Actions secrets."
            exit 1
          fi
          echo "Supabase secrets present."
          if [ -z "${{ secrets.JUSTTCG_API_KEY }}" ] && [ -z "${{ secrets.TCG_API_KEY }}" ]; then
            echo "::warning::JUSTTCG_API_KEY and TCG_API_KEY empty — synthetic history fallback."
          elif [ -n "${{ secrets.JUSTTCG_API_KEY }}" ]; then
            echo "JUSTTCG_API_KEY is present (preferred NM sync)."
          fi
          if [ -n "${{ secrets.POKEMONTCG_API_KEY }}" ]; then
            echo "POKEMONTCG_API_KEY present (legacy key; API deprecated, EOL 2027-03-01)."
          else
            echo "No POKEMONTCG_API_KEY — unkeyed gap-fill pace (~2.5s). New keys unavailable."
          fi

      - name: Diagnose Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          url = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/"
          key = os.environ["SUPABASE_KEY"]
          req = Request(url, headers={"apikey": key, "Authorization": f"Bearer {key}"})
          try:
              with urlopen(req, timeout=30) as resp:
                  print("status", resp.status)
          except HTTPError as exc:
              detail = exc.read()[:500]
              print("HTTPError", exc.code, detail)
              raise SystemExit(f"Supabase REST failed: HTTP {exc.code}") from exc
          except URLError as exc:
              raise SystemExit(f"Supabase network failed: {exc}") from exc
          print("Supabase REST OK")
          PY

      - name: Run nightly_update.py
        env:
          PYTHONUNBUFFERED: "1"
          # Schedule → gapfill + drip. Manual → honor workflow_dispatch inputs.
          NIGHTLY_CATALOG_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.catalog_mode || 'gapfill' }}
          NIGHTLY_CARD_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.card_limit || '400' }}
          NIGHTLY_CATALOG_SET_BUDGET: ${{ github.event_name == 'workflow_dispatch' && inputs.catalog_set_budget || '50' }}
          # Resolve missing cards.tcgplayer_id via TCGplayer public search (drip).
          NIGHTLY_BACKFILL_TCP: "1"
          NIGHTLY_BACKFILL_TCP_LIMIT: "60"
          # Keep JustTCG search off by default (429 risk); TCP search is primary.
          NIGHTLY_BACKFILL_JUSTTCG: "0"
          # Soft wall-clock SLO (default 150m) before GitHub's 180m hard kill.
          # Fail the job if retrain writes 0 quotes or elapsed exceeds this budget.
          NIGHTLY_SLO_MAX_SECONDS: "9000"
          # Optional: CATALOG_SET_IDS="sv3pt5:151,swsh7:Evolving Skies,..."
          CATALOG_SET_IDS: ${{ secrets.CATALOG_SET_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_OAUTH_TOKEN: ${{ secrets.EBAY_OAUTH_TOKEN }}
          EBAY_LIQUIDITY_SAMPLE_N: ${{ secrets.EBAY_LIQUIDITY_SAMPLE_N }}
          # Optional watchlist email digests
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_THRESHOLD_PCT: ${{ secrets.ALERT_THRESHOLD_PCT }}
          ALERT_SURE_ONLY: ${{ secrets.ALERT_SURE_ONLY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python nightly_update.py

      - name: Upload automation.log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-automation-log
          path: automation.log
          if-no-files-found: ignore

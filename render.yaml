# Optional one-click API on Render (https://render.com).
# Dashboard → New → Blueprint → this file.
services:
  - type: web
    name: kestrel-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    # Soft Ink production: ~1 CPU / 2GB (Render “standard”-class). Free/512MB OOMs.
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: KESTREL_SERVICE
        value: api
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: KESTREL_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_DISABLED
        value: "0"
      - key: PRO_OPEN
        value: "1"
      - key: PSA_PUBLIC_API_TOKEN
        sync: false
